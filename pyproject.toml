[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab1-bigdata-Khaled-grp6"
version = "0.1.0"
description = "Lab SQL analytics with DuckDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb",
    "pandas>=2.3.3",
    "trino>=0.340.0",
]

[project.scripts]
dataset-users = "lab1_bigdata_khaled_grp6.dataset_users:main"
dataset-orders = "lab1_bigdata_khaled_grp6.dataset_orders:main"
orders-report = "lab1_bigdata_khaled_grp6.orders_report:main"
